<!DOCTYPE html>
<html>
<head>
    <title>Network Congestion Detector</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 30px; }
       .box { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
       .result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; }
       .normal { background: #d4edda; color: #155724; }
       .congested { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Network Congestion Detector</h2>
        <form action="/predict" method="post">
            <label>Inbound Rate (bit/s)</label>
            <input type="number" step="any" name="inbound_rate" required>

            <label>Outbound Rate (bit/s)</label>
            <input type="number" step="any" name="outbound_rate" required>

            <label>Inbound Bandwidth Utilization (%)</label>
            <input type="number" step="any" name="inbound_bw" required>

            <label>Outbound Bandwidth Utilization (%)</label>
            <input type="number" step="any" name="outbound_bw" required>

            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result {% if 'NORMAL' in prediction %}normal{% else %}congested{% endif %}">
            Result: {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
